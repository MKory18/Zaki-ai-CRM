version: '3.8'

services:
  salesflow-db:
    image: postgres:16-alpine
    container_name: salesflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesflow_user}
      # REQUIRED — provide in your shell / deployment secret store. NEVER commit a real password.
      # Local dev: put it in .env (git-ignored). Production: Coolify/Vault secret.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (openssl rand -base64 24)}
      POSTGRES_DB: ${POSTGRES_DB:-salesflow}
    ports:
      # Bind only to localhost — never expose PostgreSQL publicly
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesflow_user -d salesflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  salesflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salesflow-app
    restart: always
    depends_on:
      salesflow-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-salesflow_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@salesflow-db:5432/${POSTGRES_DB:-salesflow}?schema=public&connection_limit=10&pool_timeout=20
      # REQUIRED — provide in your shell / .env before running docker compose up
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -base64 32)}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}

volumes:
  postgres_data:
